name: verify

on:
  push:
    branches: [main]
  pull_request:

# Local verification and CI invoke the same container boundary.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify through the Docker Compose boundary
        env:
          KEYJACK_ACK_VULNERABLE: i-understand-this-is-intentionally-vulnerable
        run: >-
          docker compose --profile verify up --build
          --abort-on-container-exit --exit-code-from harness

      - name: Tear down
        if: always()
        run: docker compose --profile verify down -v
